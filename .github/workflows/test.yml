# 시험과 이미지 굽기. GSM 의 test.yml 을 본떴다.
#
# 배포는 여기서 안 한다. deploy/host/deploy.sh 는 사람이 부른다.
# PBDB·Zenodo 를 타는 시험은 없다 — CI 가 남의 서버를 두드리지 않는다.
name: 시험

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 뷰어·파이프라인 시험
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-web.txt

      - name: 뷰어 시험
        run: python web/manage.py test viewer --verbosity 2
        env:
          WEGENER_SECRET_KEY: ci-only-not-a-secret

      # 규칙 시험은 표준 라이브러리만 쓴다 — 파이프라인 의존성을 깔지 않는다.
      - name: 파이프라인 규칙 시험
        run: python -m unittest discover -s pipeline/tests -t . -v

      # 학명 음차(translit.js) — 연구자가 준 예시가 그대로 나오는지(tupandactyl 020). 러너에 node 가 있다
      - name: 학명 음차 시험
        run: node web/viewer/jstest/translit.test.js

      # 분포 분석의 셈(analysis.js) — 시점 몫·가중 분위수·몬테카를로(koprifossillab 044). 몫의 보기는 파이프라인 시험과 같은 파일
      - name: 분석 셈 시험
        run: node web/viewer/jstest/analysis.test.js

      - name: collectstatic
        run: python web/manage.py collectstatic --noinput
        env:
          WEGENER_SECRET_KEY: ci-only-not-a-secret

  # 병합 전 판 확인(wetherilli 010) — PR 의 판·CHANGELOG·태그가 main 과 부딪히지 않는가. PR 머리(merge 커밋이 아니라)를 본다.
  version:
    name: 판 확인
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: git fetch --no-tags origin ${{ github.base_ref }}
      - run: python deploy/check_version.py --base origin/${{ github.base_ref }}

  build:
    name: 이미지 굽기
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      # Docker Hub 에 올리기는 저장소 변수 DOCKERHUB_PUSH=true 일 때만 — 비밀값(DOCKERHUB_*)을 넣기 전까지 끈다.
      # 꺼 두어도 굽기는 돈다(Dockerfile 이 깨지지 않았는지 본다).
      - name: Docker Hub 로그인
        if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          push: ${{ startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_PUSH == 'true' }}
          tags: koprifossillab/wegenersdream:${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
